{% extends "base.html" %}
{% load static %}

{% block title %}Request a Quote{% endblock %}

{% block content %}
<style>
  body {
    background: url("{% static 'img/isto.png' %}") no-repeat center center/cover;
    background-attachment: fixed;
  }
  
.appointment-section {
  position: relative;
  padding: 140px 0 80px; /* 👈 Adds top padding so it clears the navbar */
  display: flex;
  justify-content: center;
  align-items: center;
}


  .appointment-overlay {
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.7);
  }

  .appointment-container {
    position: relative;
    z-index: 1;
    max-width: 380px;
    width: 100%;
    background: rgba(255, 255, 255, 0.96);
    border-radius: 12px;
    box-shadow: 0 6px 25px rgba(0, 0, 0, 0.15);
    padding: 25px 22px;
    animation: fadeIn 1s ease;
  }

  .appointment-container h2 {
    text-align: center;
    color: #008D72;
    font-size: 1.6rem;
    margin-bottom: 18px;
  }

  label {
    display: block;
    margin-top: 12px;
    font-weight: 600;
    font-size: 0.9rem;
    color: #333;
  }

  input, textarea, select {
    width: 100%;
    padding: 9px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 0.9rem;
    transition: all 0.2s ease;
  }

  input:focus, textarea:focus, select:focus {
    border-color: #008D72;
    box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
    outline: none;
  }

  button {
    width: 100%;
    margin-top: 18px;
    padding: 10px;
    background: #008D72;
    color: white;
    font-size: 0.95rem;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.3s ease, transform 0.1s;
  }

  button:hover {
    background: #008D72;
    transform: translateY(-1px);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    .appointment-container {
      max-width: 90%;
      padding: 18px;
    }
    .appointment-container h2 {
      font-size: 1.4rem;
    }
  }
</style>

<section class="appointment-section">
  <div class="appointment-overlay"></div>
  <div class="appointment-container">
    <h2> Request a Quote</h2>
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Submit</button>
    </form>
  </div>
</section>
{% endblock %}
