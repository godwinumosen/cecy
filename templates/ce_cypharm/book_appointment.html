{% load static %}
<html>
<head>
  <title>Book an Appointment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: url("{% static 'img/images/blog-1.jpg' %}") no-repeat center center;
      background-size: contain;
      background-attachment: fixed;
      background-color: #f2f8ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.6);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 360px; /* 👈 smaller width */
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      padding: 22px 20px; /* 👈 reduced padding */
      backdrop-filter: blur(6px);
      animation: fadeIn 0.8s ease;
    }

    h2 {
      text-align: center;
      color: #0069d9;
      font-size: 1.5rem; /* 👈 smaller heading */
      margin-bottom: 15px;
      letter-spacing: 0.3px;
    }

    /* Add a little space above first label (Name) */
    .container form label:first-of-type {
      margin-top: 15px;
      display: block;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: 600;
      font-size: 0.9rem; /* 👈 slightly smaller font */
      color: #333;
    }

    input, textarea, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.9rem; /* 👈 smaller text */
      transition: all 0.2s ease;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 10px;
      background: #007bff;
      color: white;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.1s;
    }

    button:hover {
      background: #0056b3;
      transform: translateY(-1px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .container {
        max-width: 90%;
        padding: 18px;
      }
      h2 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="container">
    <h2>Book an Appointment</h2>
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
